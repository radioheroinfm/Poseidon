[package]
name = "poseidon-desktop"
version = "0.1.0"
description = "Poseidon — Hermes Agent Desktop on Tauri"
authors = ["Poseidon Team"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "poseidon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
open = "5"
which = "7"
dirs = "6"
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
