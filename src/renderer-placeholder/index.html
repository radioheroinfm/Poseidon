<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poseidon</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #0b1628 0%, #070c14 70%);
      color: #67e8f9;
      font-family: "JetBrains Mono", "Fira Code", ui-monospace, system-ui, sans-serif;
      text-align: center;
      gap: 14px;
      user-select: none;
      -webkit-app-region: drag;
    }
    h1 {
      font-size: 2.5rem;
      margin: 0;
      letter-spacing: 0.05em;
      text-shadow: 0 0 28px rgba(103, 232, 249, 0.4);
    }
    .badge {
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid rgba(103, 232, 249, 0.35);
      background: rgba(103, 232, 249, 0.08);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
    }
    .status {
      font-size: 0.95rem;
      opacity: 0.9;
      max-width: 520px;
      line-height: 1.55;
    }
    .muted {
      opacity: 0.5;
      font-size: 0.82rem;
      margin-top: 8px;
    }
    .row {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
      justify-content: center;
      -webkit-app-region: no-drag;
    }
    button {
      background: rgba(103, 232, 249, 0.1);
      border: 1px solid rgba(103, 232, 249, 0.35);
      color: #67e8f9;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
    }
    button:hover {
      background: rgba(103, 232, 249, 0.18);
    }
    #log {
      margin-top: 20px;
      font-size: 0.78rem;
      opacity: 0.85;
      min-height: 1.2em;
      max-width: 640px;
      word-break: break-all;
      -webkit-app-region: no-drag;
    }
  </style>
</head>
<body>
  <div class="badge">POSEIDON DESKTOP • EPOCH 3</div>
  <h1>🔱 Poseidon</h1>
  <div class="status" id="status">Connecting to Tauri…</div>
  <div class="muted">Frameless · Gateway ownership · live invoke</div>

  <div class="row">
    <button id="btn-info">System Info</button>
    <button id="btn-gateway">Gateway Status</button>
    <button id="btn-ensure">Ensure Gateway</button>
    <button id="btn-ws">WS URL</button>
    <button id="btn-wsprobe">Probe WS</button>
    <button id="btn-min">Minimize</button>
    <button id="btn-close">Close</button>
  </div>
  <div id="log"></div>

  <script>
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');

    function log(msg) {
      logEl.textContent = typeof msg === 'string' ? msg : JSON.stringify(msg, null, 2);
      console.log('[Poseidon]', msg);
    }

    function getInvoke() {
      // Tauri 2 global API when withGlobalTauri: true
      const g = window.__TAURI__;
      if (g?.core?.invoke) return g.core.invoke.bind(g.core);
      if (g?.tauri?.invoke) return g.tauri.invoke.bind(g.tauri);
      if (window.__TAURI_INTERNALS__?.invoke) {
        return window.__TAURI_INTERNALS__.invoke.bind(window.__TAURI_INTERNALS__);
      }
      return null;
    }

    const invoke = getInvoke();

    if (invoke) {
      // Epoch 3 P0: nested hermesDesktop
      window.hermesDesktop = {
        windowControls: {
          custom: true,
          minimize: () => invoke('window_minimize'),
          toggleMaximize: () => invoke('window_maximize'),
          close: () => invoke('window_close'),
        },
        getVersion: async () => String(await invoke('get_version') ?? '0.1.0'),
        getGatewayWsUrl: async () => await invoke('get_gateway_ws_url'),
        getConnection: async () => {
          const st = await invoke('gateway_status');
          const wsUrl = st && st.portOpen && st.port ? ('ws://127.0.0.1:' + st.port) : null;
          return { kind: wsUrl ? 'local' : 'none', wsUrl, port: st?.port ?? null, status: st };
        },
        getBootProgress: async () => ({ phase: 'poseidon-shell', ready: true }),
        openExternal: async (url) => { await invoke('open_external', { url }); },
        __poseidon: {
          getSystemInfo: () => invoke('get_system_info'),
          gatewayStart: () => invoke('gateway_start'),
          gatewayStop: () => invoke('gateway_stop'),
          gatewayStatus: () => invoke('gateway_status'),
          gatewayEnsure: () => invoke('gateway_ensure'),
        },
      };
      // Safe stubs (Zhenya audit #6): on* -> unsub fn; bool flags -> false
      const seen = new Set();
      const BOOL_FLAGS = new Set(['glassSupported','translucencySupported','localModelsEnabled','assumeFreshInstall']);
      const stub = (path, leaf) => {
        if (/^on[A-Z]/.test(leaf)) {
          return () => { if (!seen.has(path)) { seen.add(path); console.warn('[stub on]', path); } return () => {}; };
        }
        return new Proxy(async () => null, {
          get(_t, prop) {
            if (prop === 'then') return undefined;
            if (typeof prop === 'symbol') return undefined;
            const p = path + '.' + String(prop);
            if (!seen.has(p)) { seen.add(p); console.warn('[stub]', p); }
            return stub(p, String(prop));
          },
          apply() { if (!seen.has(path+'()')) { seen.add(path+'()'); console.warn('[stub call]', path); } return Promise.resolve(null); }
        });
      };
      window.hermesDesktop = new Proxy(window.hermesDesktop, {
        get(t, prop) {
          if (prop in t) return t[prop];
          const p = String(prop);
          if (BOOL_FLAGS.has(p)) { if (!seen.has(p)) { seen.add(p); console.warn('[stub bool]', p); } return false; }
          if (!seen.has(p)) { seen.add(p); console.warn('[stub missing]', p); }
          return stub(p, p);
        },
        has() { return true; }
      });
      // Explicit false flags on real object too
      window.hermesDesktop.glassSupported = false;
      window.hermesDesktop.translucencySupported = false;
      window.hermesDesktop.localModelsEnabled = false;
      window.hermesDesktop.assumeFreshInstall = false;
      statusEl.textContent = 'hermesDesktop P0+ + safe stubs';
      log('P0+ stubs: on* unsubscribe, bool flags false');
    } else {
      statusEl.textContent = 'Tauri global API not found (open via tauri dev/build)';
      log('No __TAURI__ — browser-only preview');
    }

    async function call(cmd, args) {
      if (!invoke) {
        log(cmd + ': no invoke');
        return;
      }
      try {
        const result = await invoke(cmd, args || {});
        log(result);
        return result;
      } catch (e) {
        log(cmd + ' error: ' + (e?.message || String(e)));
      }
    }

    document.getElementById('btn-info').onclick = () => call('get_system_info');
    document.getElementById('btn-gateway').onclick = () => call('gateway_status');
    document.getElementById('btn-ensure').onclick = () => call('gateway_ensure');
    document.getElementById('btn-ws').onclick = () => call('get_gateway_ws_url');
    document.getElementById('btn-wsprobe').onclick = async () => {
      try {
        const url = await invoke('get_gateway_ws_url');
        if (!url) { log('no WS URL — Ensure Gateway first'); return; }
        log('probing ' + url + ' ...');
        const ws = new WebSocket(url);
        const timer = setTimeout(() => { try { ws.close(); } catch(_){} log('WS probe timeout'); }, 4000);
        ws.onopen = () => { clearTimeout(timer); log('WS OPEN ' + url); ws.close(); };
        ws.onerror = (e) => { clearTimeout(timer); log('WS error (may need auth/protocol) — socket reached network layer'); };
        ws.onclose = (ev) => { clearTimeout(timer); log('WS close code=' + ev.code + ' reason=' + (ev.reason||'')); };
      } catch (e) { log('probe failed: ' + e); }
    };
    document.getElementById('btn-min').onclick = () => call('window_minimize');
    document.getElementById('btn-close').onclick = () => call('window_close');

    // Auto probe on load
    if (invoke) {
      call('get_system_info').then((info) => {
        if (info?.platform) {
          statusEl.textContent =
            'hermesDesktop P0 · ' + info.platform + '/' + info.arch + ' · v' + info.version;
        }
      });
    }
  </script>
</body>
</html>
